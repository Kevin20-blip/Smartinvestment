<!DOCTYPE html><html>
<head>
  <title>SmartInvest</title>
</head>
<body>  <h1>🚀 SmartInvest</h1>
  <h2>Login</h2><input id="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="login()">Login</button>

  <p id="result"></p>  <script>
    async function login() {
      const result = document.getElementById("result");

      try {
        // 🔐 Login request
        const res = await fetch("/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
          })
        });

        const data = await res.json();

        if (data.token) {
          result.innerText = "✅ Logged in!\n";

          // Save token
          localStorage.setItem("token", data.token);

          // 👇 Fetch profile
          const profileRes = await fetch("/profile", {
            headers: {
              "Authorization": data.token
            }
          });

          const profile = await profileRes.json();

          // 👇 Display user info
          result.innerText += "📧 Email: " + profile.email + "\n";
          result.innerText += "💰 Balance: $" + profile.balance;

        } else {
          result.innerText = "❌ " + data.message;
        }

      } catch (err) {
        result.innerText = "⚠️ Server error";
      }
    }
  </script></body>
</html>
