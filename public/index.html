<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Investment</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      text-align: center;
    }

    .container {
      padding: 40px;
    }

    input {
      padding: 10px;
      margin: 5px;
      border-radius: 5px;
      border: none;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      margin: 20px auto;
      border-radius: 10px;
      max-width: 300px;
    }

    button {
      padding: 10px 20px;
      background: #22c55e;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }

    #result {
      margin-top: 10px;
      color: #38bdf8;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>💰 Smart Investment</h1>

  <input id="amount" type="number" placeholder="Amount">
  <input id="profitInput" type="number" placeholder="Profit"><br><br>

  <button onclick="saveData()">Save</button>

  <div class="card">
    <h3>📊 Portfolio Value</h3>
    <p id="portfolio">$0</p>
  </div>

  <div class="card">
    <h3>📈 Profit</h3>
    <p id="profit">$0</p>
  </div>

  <p id="result"></p>
</div>

<script>
  // Load saved data on page load
  function loadData() {
    fetch('/api')
      .then(res => res.json())
      .then(data => {
        document.getElementById('portfolio').innerText = "$" + data.portfolio;
        document.getElementById('profit').innerText = "+$" + data.profit;
      });
  }

  // Save data to server
  function saveData() {
    const portfolio = document.getElementById("amount").value;
    const profit = document.getElementById("profitInput").value;

    fetch('/api', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ portfolio, profit })
    })
    .then(res => res.json())
    .then(data => {
      document.getElementById("result").innerText = data.message;
      loadData();
    });
  }

  loadData();
</script>

</body>
</html>
