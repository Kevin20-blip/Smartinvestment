<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Investment</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #0f172a;
      color: white;
      padding: 50px;
    }
    button {
      padding: 10px 20px;
      background: #22c55e;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h1>💰 Smart Investment App</h1>
  <p>Welcome to your live app 🚀</p>

  <button onclick="loadAPI()">Check API</button>

  <p id="result"></p>

  <script>
    function loadAPI() {
      fetch('/api')
        .then(res => res.json())
        .then(data => {
          document.getElementById('result').innerText = data.message;
        });
    }
  </script>

</body>
</html>
