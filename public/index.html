<!DOCTYPE html><html>
<head>
  <title>SmartInvest</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }.card {
  background: rgba(30, 41, 59, 0.95);
  padding: 30px;
  border-radius: 12px;
  width: 300px;
  text-align: center;
  box-shadow: 0 0 25px rgba(0,0,0,0.6);
}

input {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  border-radius: 6px;
  border: none;
}

button {
  width: 100%;
  padding: 10px;
  background: #3b82f6;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  background: #2563eb;
}

#result {
  margin-top: 15px;
  white-space: pre-line;
}

  </style>
</head><body>
  <div class="card">
    <h1>🚀 SmartInvest</h1>
    <h3>Login</h3><input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="result"></p>

  </div>  <script>
    async function login() {
      const result = document.getElementById("result");

      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
          })
        });

        const data = await res.json();

        if (data.token) {
          result.innerText = "✅ Logged in!\n";

          localStorage.setItem("token", data.token);

          const profileRes = await fetch("/profile", {
            headers: {
              "Authorization": data.token
            }
          });

          const profile = await profileRes.json();

          result.innerText += "📧 " + profile.email + "\n";
          result.innerText += "💰 $" + profile.balance;

        } else {
          result.innerText = "❌ " + data.message;
        }

      } catch {
        result.innerText = "⚠️ Server error";
      }
    }
  </script></body>
</html>
