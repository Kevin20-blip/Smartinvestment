<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Investment</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      text-align: center;
    }

    .container {
      padding: 50px 20px;
    }

    h1 {
      font-size: 2.5rem;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      margin: 20px auto;
      border-radius: 10px;
      max-width: 300px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    button {
      padding: 10px 20px;
      background: #22c55e;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 16px;
      border-radius: 5px;
    }

    button:hover {
      background: #16a34a;
    }

    #result {
      margin-top: 15px;
      font-size: 14px;
      color: #38bdf8;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>💰 Smart Investment</h1>
    <p>Grow your wealth smarter 🚀</p>

    <div class="card">
      <h3>📊 Portfolio Value</h3>
      <p>$10,000</p>
    </div>

    <div class="card">
      <h3>📈 Profit</h3>
      <p>+$1,250</p>
    </div>

    <button onclick="loadAPI()">Check Server</button>

    <p id="result"></p>
  </div>

  <script>
    function loadAPI() {
      fetch('/api')
        .then(res => res.json())
        .then(data => {
          document.getElementById('result').innerText = data.message;
        });
    }
  </script>

</body>
</html>
